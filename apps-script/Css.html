<style>
/* Layout: app satu kolom (maks 760px) dengan hero dua kolom di tab Bayar; nav bawah dengan Bayar di tengah.
   Warna diambil dari logo Eunoia: hijau daun + lime, netral berbias hijau. */
:root {
  color-scheme: light;
  --page: #f4f6ef;
  --surface: #fcfdf9;
  --surface-2: #edf1e5;
  --ink: #142010;
  --ink-2: #4b5a44;
  --muted: #7f8b78;
  --grid: #dde3d3;
  --axis: #bfc9b3;
  --border: rgba(20, 32, 16, 0.10);
  --accent: #2f7a22;          /* daun tua: tombol & link */
  --accent-ink: #ffffff;
  --lime: #a6cf3a;            /* lime logo: garis tangan, kilau */
  --hero-a: #d9ecb5;          /* gradasi fallback hero */
  --hero-b: #7cbc4a;
  --hero-c: #2f7a22;
  --shadow: 0 10px 30px rgba(31, 61, 22, 0.14);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --good: #0ca30c;
  --good-ink: #006300;
  --warning: #fab219;
  --critical: #d03b3b;
  --neutral-cell: #e8ece1;
  --radius: 14px;
  --font-display: "Bricolage Grotesque", "Plus Jakarta Sans", system-ui, sans-serif;
  --font-body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d110b; --surface: #161c13; --surface-2: #1f271b; --ink: #f2f6ec; --ink-2: #bcc8b2; --muted: #86927d;
    --grid: #283223; --axis: #36412f; --border: rgba(242, 246, 236, 0.10);
    --accent: #7cc142; --accent-ink: #0d140a; --lime: #c6e05a;
    --hero-a: #1e3415; --hero-b: #2f5a1f; --hero-c: #4f8f2c; --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    --series-1: #3987e5; --series-2: #d95926; --good-ink: #0ca30c; --neutral-cell: #2a3324;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d110b; --surface: #161c13; --surface-2: #1f271b; --ink: #f2f6ec; --ink-2: #bcc8b2; --muted: #86927d;
  --grid: #283223; --axis: #36412f; --border: rgba(242, 246, 236, 0.10);
  --accent: #7cc142; --accent-ink: #0d140a; --lime: #c6e05a;
  --hero-a: #1e3415; --hero-b: #2f5a1f; --hero-c: #4f8f2c; --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  --series-1: #3987e5; --series-2: #d95926; --good-ink: #0ca30c; --neutral-cell: #2a3324;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 15px/1.5 var(--font-body);
  padding-bottom: 76px;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }

html { scroll-behavior: smooth; }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--page);
  padding: 12px 16px 10px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
header.top .logo { width: 40px; height: 40px; border-radius: 12px; background: #fff; flex: none; object-fit: contain; box-shadow: 0 0 0 1px var(--border); }
header.top h1 { font: 700 19px/1.2 var(--font-display); margin: 0; letter-spacing: -0.01em; }
h2, .hero-copy h1 { font-family: var(--font-display); text-wrap: balance; }
header.top .sub { color: var(--ink-2); font-size: 13px; }

main { max-width: 760px; margin: 0 auto; padding: 12px 16px 24px; }
section.tab { display: none; }
section.tab.on { display: block; }

nav.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; justify-content: center;
  background: var(--surface); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
nav.bottom button {
  flex: 1; border: 0; background: none; padding: 9px 2px 8px; font-size: 11.5px; color: var(--ink-2);
  display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
}
nav.bottom button .ico { font-size: 19px; line-height: 1; }
nav.bottom button.on { color: var(--accent); font-weight: 600; }
nav.bottom button { max-width: 150px; }
nav.bottom button.utama { color: var(--accent); font-weight: 700; }
nav.bottom button.utama .ico {
  width: 46px; height: 46px; margin-top: -24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 0 0 4px var(--surface);
}

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; margin: 0 0 12px;
}
.card h2 { font-size: 15px; margin: 0 0 2px; }
.card .desc { color: var(--ink-2); font-size: 13px; margin: 0 0 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tnum { font-variant-numeric: tabular-nums; }

.hero { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin: 6px 0 2px; }
.seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button {
  flex: 1; border: 0; background: none; padding: 7px 4px; border-radius: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer;
}
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--border); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.tile { background: var(--surface-2); border-radius: 10px; padding: 10px; }
.tile .lbl { font-size: 12px; color: var(--ink-2); }
.tile .val { font-size: 17px; font-weight: 650; }

.status { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.status.good { color: var(--good-ink); }
.status.bad { color: var(--critical); }
.status.warn { color: var(--ink-2); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 10px 0; border-top: 1px solid var(--grid); }
.list li:first-child { border-top: 0; }
.list .amt { font-weight: 650; white-space: nowrap; }
.amt.in { color: var(--good-ink); }
.badge {
  display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2); margin-right: 4px;
}
.badge.flag { background: transparent; box-shadow: inset 0 0 0 1px var(--critical); color: var(--critical); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip {
  border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 5px 11px;
  font-size: 13px; cursor: pointer;
}
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.chart-wrap { position: relative; height: 220px; }
.chart-wrap.tall { height: 260px; }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); margin: 2px 0 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 13px; }

table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th, table.data td { padding: 6px 6px; border-bottom: 1px solid var(--grid); text-align: left; }
table.data th { color: var(--ink-2); font-weight: 600; }
table.data td.n, table.data th.n { text-align: right; font-variant-numeric: tabular-nums; }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }

table.mx { border-collapse: separate; border-spacing: 2px; font-size: 12px; }
table.mx th { font-weight: 600; color: var(--ink-2); padding: 2px 3px; text-align: center; }
table.mx td { width: 30px; height: 30px; text-align: center; border-radius: 6px; font-weight: 700; }
table.mx td.kav { width: auto; text-align: left; font-weight: 600; padding-right: 6px; white-space: nowrap; position: sticky; left: 0; z-index: 2; background: var(--surface); }
table.mx tr:first-child th:first-child { position: sticky; left: 0; z-index: 2; background: var(--surface); }
table.mx td.kav span { display: block; font-weight: 400; color: var(--ink-2); font-size: 11px; }
.c-lunas { background: var(--good); color: #fff; }
.c-prepaid { background: var(--good-ink); color: #fff; }
.c-klaim { background: var(--warning); color: #3a2a00; }
.c-tunggak { background: transparent; color: var(--critical); box-shadow: inset 0 0 0 1.5px var(--critical); }
.c-belum { background: var(--neutral-cell); color: var(--muted); }
.mx-legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.mx-legend span b { display: inline-flex; width: 18px; height: 18px; border-radius: 5px; align-items: center; justify-content: center; font-size: 11px; margin-right: 4px; }

label.f { display: block; font-size: 13px; color: var(--ink-2); margin: 10px 0 4px; }
input[type=text], input[type=number], input[type=date], input[type=password], input[type=email], select, textarea {
  width: 100%; padding: 10px 11px; border: 1px solid var(--axis); border-radius: 10px; background: var(--surface);
  min-height: 44px;
}
textarea { min-height: 90px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 10px;
  padding: 11px 16px; min-height: 44px; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer;
}
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: transparent; color: var(--critical); box-shadow: inset 0 0 0 1px var(--critical); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .55; cursor: wait; }

.months { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.months label {
  border: 1px solid var(--axis); border-radius: 10px; padding: 8px 4px; text-align: center; font-size: 13px; cursor: pointer;
  user-select: none; min-height: 44px; display: flex; flex-direction: column; justify-content: center;
}
.months label small { color: var(--muted); font-size: 11px; }
.months input { display: none; }
.months label.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.months label.on small { color: inherit; opacity: .85; }
.months label.paid { border-style: dashed; color: var(--muted); }

.toast {
  position: fixed; left: 16px; right: 16px; bottom: 86px; z-index: 20; background: var(--ink); color: var(--page);
  padding: 12px 14px; border-radius: 12px; font-size: 14px; display: none; max-width: 600px; margin: 0 auto;
}
.toast.on { display: block; }
.loading { color: var(--ink-2); padding: 30px 0; text-align: center; }
.empty { color: var(--ink-2); font-size: 14px; padding: 10px 0; }
.note { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--ink-2); }
.err { color: var(--critical); font-size: 13px; }

.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: none; align-items: flex-end; justify-content: center; }
.modal-bg.on { display: flex; }
.modal { background: var(--surface); width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 16px; }
@media (min-width: 700px) { .modal-bg { align-items: center; } .modal { border-radius: 16px; } }

/* ---------- progres scroll ---------- */
.progress { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 20; pointer-events: none; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--lime)); transform: scaleX(0); transform-origin: 0 50%; }

/* ---------- hero tab Bayar ---------- */
.hero-wrap {
  position: relative; isolation: isolate; overflow: hidden; margin: 0 0 14px; padding: 20px 16px 16px;
  border-radius: 24px; background: var(--surface); border: 1px solid var(--border);
}
@media (min-width: 720px) { .hero-wrap { padding: 28px 28px 22px; } }
a.btn { text-decoration: none; }
.hero-wrap::before, .hero-wrap::after {
  content: ""; position: absolute; z-index: -1; width: 420px; height: 420px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, var(--hero-a) 0%, transparent 65%); opacity: .7;
}
.hero-wrap::before { top: -180px; left: -140px; animation: drift 18s ease-in-out infinite alternate; }
.hero-wrap::after { bottom: -220px; right: -160px; background: radial-gradient(circle, color-mix(in srgb, var(--lime) 35%, transparent) 0%, transparent 65%); animation: drift 22s ease-in-out infinite alternate-reverse; }
@keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(60px, 40px) scale(1.12); } }

.lead { display: grid; gap: 18px; align-items: center; }
@media (min-width: 720px) { .lead { grid-template-columns: 1.05fr 1fr; gap: 28px; } }
.hero-copy { min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.hero-copy h1 { font-size: clamp(30px, 7vw, 44px); line-height: 1.05; margin: 6px 0 10px; font-weight: 800; letter-spacing: -0.02em; }
.scribble { position: relative; white-space: nowrap; }
.scribble svg { position: absolute; left: -2%; bottom: -0.28em; width: 104%; height: .5em; overflow: visible; }
.scribble path { fill: none; stroke: var(--lime); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 320; stroke-dashoffset: 0; animation: draw 1.1s .3s ease-out both; }
@keyframes draw { from { stroke-dashoffset: 320; } to { stroke-dashoffset: 0; } }
.hero-copy p { color: var(--ink-2); margin: 0 0 16px; max-width: 46ch; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn-ghost-link { display: inline-flex; align-items: center; min-height: 44px; padding: 0 6px; font-weight: 600; text-decoration: none; }

.hero-media { position: relative; min-width: 0; padding-bottom: 54px; }
.hero-img {
  position: relative; border-radius: 22px; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%;
  background: linear-gradient(140deg, var(--hero-a), var(--hero-b) 55%, var(--hero-c));
  box-shadow: var(--shadow);
}
.hero-img .ph {
  position: absolute; inset: -8% 0; background-size: cover; background-position: center;
  will-change: transform;
}
.hero-img .credit { position: absolute; right: 10px; top: 10px; font-size: 10.5px; color: #fff; background: rgba(0,0,0,.35); padding: 2px 7px; border-radius: 999px; }
.hero-img .leaf { position: absolute; left: 14px; top: 14px; width: 54px; height: 54px; opacity: .9; }

/* kartu rekening yang melayang di sudut foto */
.card.rek {
  position: absolute; left: 12px; right: 12px; bottom: 0; margin: 0; text-align: left;
  box-shadow: var(--shadow); padding: 14px 16px;
}
@media (min-width: 720px) { .card.rek { left: -26px; right: auto; width: min(330px, 92%); } }
.rek-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rek-bank { font-weight: 800; font-size: 14px; color: var(--accent); letter-spacing: .04em; margin: 0; }
.rek-no { font: 800 30px/1.1 var(--font-display); letter-spacing: .02em; margin: 2px 0; user-select: all; -webkit-user-select: all; font-variant-numeric: tabular-nums; }
.rek .btn { min-height: 40px; padding: 8px 14px; }

/* tombol utama: denyut, kilau, percikan saat hover */
.btn.cta { position: relative; overflow: hidden; animation: pulse 2.8s ease-in-out infinite; }
.btn.cta::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
  transform: skewX(-18deg) translateX(0); animation: shine 4.2s ease-in-out infinite;
}
.btn.cta::after {
  content: "✦"; position: absolute; right: 10px; top: 4px; font-size: 13px; color: var(--lime);
  opacity: 0; transform: scale(.4) rotate(-30deg); transition: opacity .25s, transform .35s;
}
.btn.cta:hover::after, .btn.cta:focus-visible::after { opacity: 1; transform: scale(1) rotate(0); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 50% { box-shadow: 0 0 0 8px transparent; } }
@keyframes shine { 0%, 60% { transform: skewX(-18deg) translateX(0); } 100% { transform: skewX(-18deg) translateX(420%); } }

/* angka statistik */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 4px 0 12px; }
@media (max-width: 460px) { .stats { grid-template-columns: 1fr 1fr; } .stats .stat:last-child { grid-column: span 2; } }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; min-width: 0; }
.stat .ic { width: 26px; height: 26px; color: var(--accent); animation: bob 3.2s ease-in-out infinite; display: block; }
.stat:nth-child(2) .ic { animation-delay: .5s; } .stat:nth-child(3) .ic { animation-delay: 1s; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.stat .num { font: 800 20px/1.15 var(--font-display); margin-top: 6px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .lbl { font-size: 12px; color: var(--ink-2); }

/* kartu tarif: "bernapas" dan centang yang tergambar */
.tarif { border-color: color-mix(in srgb, var(--accent) 35%, transparent); animation: breathe 6s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.012); } }
.tarif .harga { font: 800 28px/1.1 var(--font-display); margin: 4px 0 2px; }
.tarif .harga small { font: 600 14px var(--font-body); color: var(--ink-2); }
.checks { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.checks li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; }
.checks svg { width: 22px; height: 22px; }
.checks circle { fill: color-mix(in srgb, var(--accent) 14%, transparent); }
.checks path { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 0; animation: draw-check .5s ease-out both; }
.checks li:nth-child(2) path { animation-delay: .15s; } .checks li:nth-child(3) path { animation-delay: .3s; } .checks li:nth-child(4) path { animation-delay: .45s; }
@keyframes draw-check { from { stroke-dashoffset: 20; } to { stroke-dashoffset: 0; } }

/* kartu yang bisa disentuh: terangkat saat hover */
.lift { transition: transform .2s ease, box-shadow .2s ease; }
.lift:hover { transform: translateY(-3px); box-shadow: var(--shadow); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
