<script>
/* Kas Eunoia — UI web app (vanilla JS). Data dari Api.gs lewat google.script.run. */
// Tampilkan error JavaScript di halaman, supaya kelihatan tanpa membuka console.
function showFatal(msg) {
  const el = document.getElementById('tab-ringkasan');
  if (el) el.insertAdjacentHTML('beforeend', '<div class="note err" style="margin-top:12px">Error: ' +
    String(msg).replace(/[<>&]/g, '') + '</div>');
}
window.addEventListener('error', e => showFatal(e.message + (e.lineno ? ' (baris ' + e.lineno + ')' : '')));
window.addEventListener('unhandledrejection', e => showFatal(e.reason && e.reason.message || e.reason));
const BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const KELAS = {
  iuran: 'Iuran', khusus: 'Iuran khusus', pengeluaran: 'Pengeluaran', biaya_bank: 'Biaya bank', bunga: 'Bunga bank',
  tombokan: 'Tombokan bendahara', pelunasan: 'Pelunasan utang', pemasukan_lain: 'Pemasukan lain', review: 'Perlu dicek', abaikan: 'Diabaikan'
};
const CELL = {
  lunas: { sym: '✓', cls: 'c-lunas', label: 'Lunas (terverifikasi bank)' },
  prepaid: { sym: 'P', cls: 'c-prepaid', label: 'Lunas, dibayar sebelum periode tracking' },
  klaim: { sym: '…', cls: 'c-klaim', label: 'Klaim, menunggu statement bank' },
  tunggak: { sym: '✗', cls: 'c-tunggak', label: 'Belum bayar' },
  belum: { sym: '', cls: 'c-belum', label: 'Belum jatuh tempo' }
};

const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) { /* abaikan */ } }
};
const S = { pub: null, admin: null, token: store.get('kas_token'), year: null, saldoMode: 'terkonfirmasi',
  trxFilter: 'semua', adminTab: 'review', formInfo: null, form: null, charts: {}, preview: null };

// ---------- util ----------
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => (n < 0 ? '−' : '') + 'Rp ' + Math.round(Math.abs(+n || 0)).toLocaleString('id-ID');
const rpShort = n => { const a = Math.abs(n); return a >= 1e6 ? (n / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' jt' : a >= 1e3 ? Math.round(n / 1e3) + ' rb' : String(n); };
const lb = ym => BULAN[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4);
const lbShort = ym => BULAN[+ym.slice(5, 7) - 1] + " '" + ym.slice(2, 4);
const tgl = iso => iso ? (+iso.slice(8, 10)) + ' ' + BULAN[+iso.slice(5, 7) - 1] + ' ' + iso.slice(0, 4) : '-';
const addM = (ym, n) => { let y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + String(m + 1).padStart(2, '0'); };
const rangeBulan = list => !list || !list.length ? '' : list.length === 1 ? lb(list[0]) : lbShort(list[0]) + '–' + lbShort(list[list.length - 1]) + ' (' + list.length + ' bln)';
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const todayIso = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

function run(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
}
function toast(msg, ms = 3500) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms);
}
function fail(e) { toast(e && e.message ? e.message : String(e), 6000); }
function modal(html) { $('#modal-body').innerHTML = html; $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

function copyViaTextarea(text) {
  const t = document.createElement('textarea');
  t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  t.remove(); return ok;
}
async function copyText(text, pesan = 'Tersalin. Tinggal paste di WhatsApp.') {
  try { await navigator.clipboard.writeText(text); toast(pesan); }
  catch (e) {
    if (copyViaTextarea(text)) { toast(pesan); return; }
    modal(`<h2>Salin teks</h2><p class="desc">Tekan lama → Pilih semua → Salin.</p><textarea id="cp" style="min-height:260px">${esc(text)}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn" onclick="const t=$('#cp');t.select();document.execCommand('copy');toast('Tersalin')">Salin</button>
      <button class="btn ghost" onclick="closeModal()">Tutup</button></div>`);
    $('#cp').select();
  }
}

function fileToBase64(file, maxDim = 1600) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Gagal membaca file'));
    if (file.type.startsWith('image/')) {
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, maxDim / Math.max(img.width, img.height));
          const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve({ name: file.name.replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.82).split(',')[1] });
        };
        img.onerror = () => reject(new Error('Gambar tidak bisa dibaca'));
        img.src = reader.result;
      };
    } else {
      if (file.size > 5 * 1024 * 1024) return reject(new Error('File maksimal 5 MB'));
      reader.onload = () => resolve({ name: file.name, mime: file.type || 'application/pdf', data: String(reader.result).split(',')[1] });
    }
    reader.readAsDataURL(file);
  });
}

// ---------- navigasi ----------
document.querySelectorAll('nav.bottom button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
function showTab(name) {
  document.querySelectorAll('nav.bottom button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  document.querySelectorAll('section.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + name));
  window.scrollTo(0, 0);
  if (name === 'bayar') renderBayar();
  if (name === 'bendahara') renderBendahara();
}

async function loadPublic() {
  const json = await run('apiPublic');
  S.pub = JSON.parse(json);
  if (!S.year) S.year = S.pub.bulanIni.slice(0, 4);
  $('#judul').textContent = S.pub.namaKas;
  $('#subjudul').textContent = S.pub.bankUntil && S.pub.bankUntil !== '0000-00-00'
    ? 'Data bank s/d ' + tgl(S.pub.bankUntil) + ' · transparan untuk semua warga'
    : 'Belum ada mutasi bank';
  renderRingkasan(); renderIuran(); renderTransaksi();
}

// ---------- ringkasan ----------
function renderRingkasan() {
  const p = S.pub, s = p.saldo;
  const modes = {
    terkonfirmasi: { label: 'Bank', val: s.terkonfirmasi, cap: 'Saldo akhir di statement BCA terakhir (per ' + tgl(s.perTanggal) + ').' },
    estimasi: { label: 'Estimasi', val: s.estimasi, cap: 'Saldo bank + klaim masuk ' + rp(s.masukMenunggu) + ' − klaim keluar ' + rp(s.keluarMenunggu) + ' yang belum ada di statement.' },
    proyeksi: { label: 'Akhir bulan', val: s.proyeksi, cap: 'Estimasi dikurangi pengeluaran rutin yang belum dibayar s/d ' + lb(p.bulanIni) + ' (' + rp(s.kurangRutin) + ').' }
  };
  const m = modes[S.saldoMode];
  const years = [...new Set(p.cashflow.map(c => c.bulan.slice(0, 4)))].sort();
  const cf = p.cashflow.filter(c => c.bulan.slice(0, 4) === S.year);
  const peng = p.pengeluaran[S.year] || {};
  const pengRows = Object.keys(peng).map(k => [k, peng[k]]).sort((a, b) => b[1] - a[1]);
  const totalIn = cf.reduce((a, c) => a + c.masuk, 0), totalOut = cf.reduce((a, c) => a + c.keluar, 0);
  const lastYm = p.bankUntil && p.bankUntil !== '0000-00-00' ? p.bankUntil.slice(0, 7) : p.bulanIni;

  $('#tab-ringkasan').innerHTML = `
    <div class="card">
      <div class="seg" role="tablist">${Object.keys(modes).map(k => `<button class="${k === S.saldoMode ? 'on' : ''}" data-mode="${k}">${modes[k].label}</button>`).join('')}</div>
      <div class="hero tnum">${rp(m.val)}</div>
      <div class="small muted">${esc(m.cap)}</div>
      <div class="tiles">
        <div class="tile"><div class="lbl">Utang kas ke bendahara</div><div class="val">${rp(s.utangBendahara)}</div></div>
        <div class="tile"><div class="lbl">Saldo bersih (${m.label.toLowerCase()} − utang)</div><div class="val">${rp(m.val - s.utangBendahara)}</div></div>
      </div>
    </div>

    <div class="card">
      <h2>Pengeluaran rutin ${lb(p.bulanIni)}</h2>
      <p class="desc">Lunas kalau pembayarannya sudah terlihat di mutasi bank atau diinput bendahara.</p>
      <ul class="list">${p.expected.map(e => `<li class="spread">
        <div><b>${esc(e.nama)}</b><div class="small muted">${rp(e.nominal)}/bulan · tgl ${e.tgl} · ${e.terbayar}/${e.jatuhTempo} bulan terbayar</div></div>
        ${e.lunasBulanIni ? `<span class="status good">✓ Lunas${e.selisih > 0 ? ' (+' + e.selisih + ' bln)' : ''}</span>` : `<span class="status bad">✗ Belum${-e.selisih > 1 ? ' (' + (-e.selisih) + ' bln)' : ''}</span>`}
      </li>`).join('') || '<li class="empty">Belum ada pengeluaran rutin.</li>'}</ul>
    </div>

    ${years.length > 1 ? `<div class="chips">${years.map(y => `<button class="chip ${y === S.year ? 'on' : ''}" data-year="${y}">${y}</button>`).join('')}</div>` : ''}

    <div class="card">
      <div class="spread"><h2>Uang masuk & keluar ${S.year}</h2><button class="linkbtn" data-table="t-cf">Tabel</button></div>
      <p class="desc">Per bulan, berdasarkan tanggal transaksi di bank. Total masuk ${rp(totalIn)} · keluar ${rp(totalOut)}.</p>
      <div class="legend"><span><i style="background:var(--series-1)"></i>Masuk</span><span><i style="background:var(--series-2)"></i>Keluar</span></div>
      <div class="chart-wrap"><canvas id="ch-cf" aria-label="Grafik uang masuk dan keluar per bulan"></canvas></div>
      <div id="t-cf" hidden class="scroll-x"><table class="data"><tr><th>Bulan</th><th class="n">Masuk</th><th class="n">Keluar</th><th class="n">Saldo akhir</th></tr>
        ${cf.map(c => `<tr><td>${lb(c.bulan)}</td><td class="n">${rp(c.masuk)}</td><td class="n">${rp(c.keluar)}</td><td class="n">${c.saldo_akhir == null ? '-' : rp(c.saldo_akhir)}</td></tr>`).join('')}</table></div>
    </div>

    <div class="card">
      <h2>Saldo bank akhir bulan</h2>
      <p class="desc">Dari ringkasan tiap e-Statement BCA.</p>
      <div class="chart-wrap"><canvas id="ch-saldo" aria-label="Grafik saldo akhir bulan"></canvas></div>
    </div>

    <div class="card">
      <div class="spread"><h2>Pengeluaran ${S.year} per kategori</h2><button class="linkbtn" data-table="t-peng">Tabel</button></div>
      <p class="desc">Termasuk biaya admin & transfer bank. Total ${rp(pengRows.reduce((a, r) => a + r[1], 0))}.</p>
      <div class="chart-wrap" style="height:${Math.max(120, pengRows.length * 40 + 30)}px"><canvas id="ch-peng" aria-label="Grafik pengeluaran per kategori"></canvas></div>
      <div id="t-peng" hidden><table class="data">${pengRows.map(r => `<tr><td>${esc(r[0])}</td><td class="n">${rp(r[1])}</td></tr>`).join('')}</table></div>
    </div>

    <div class="card">
      <h2>Laporan untuk grup WA</h2>
      <p class="desc">Ringkasan teks bulan terpilih, siap paste.</p>
      <div class="row"><select id="lap-bulan" style="flex:1">${p.cashflow.map(c => c.bulan).reverse().map(ym => `<option value="${ym}" ${ym === lastYm ? 'selected' : ''}>${lb(ym)}</option>`).join('')}</select>
      <button class="btn" id="btn-lap">Salin laporan</button></div>
    </div>`;

  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { S.saldoMode = b.dataset.mode; renderRingkasan(); });
  document.querySelectorAll('[data-year]').forEach(b => b.onclick = () => { S.year = b.dataset.year; renderRingkasan(); renderIuran(); });
  document.querySelectorAll('[data-table]').forEach(b => b.onclick = () => { const t = document.getElementById(b.dataset.table); t.hidden = !t.hidden; b.textContent = t.hidden ? 'Tabel' : 'Sembunyikan'; });
  $('#btn-lap').onclick = async () => {
    const btn = $('#btn-lap'); btn.disabled = true;
    try { copyText(await run('apiLaporanWa', $('#lap-bulan').value)); } catch (e) { fail(e); } finally { btn.disabled = false; }
  };
  drawCharts(cf, pengRows);
}

function baseOpts() {
  const grid = cssVar('--grid'), muted = cssVar('--muted');
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: 'index', intersect: false },
    plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ' ' + (c.dataset.label ? c.dataset.label + ': ' : '') + rp(c.parsed.y != null && c.chart.options.indexAxis !== 'y' ? c.parsed.y : c.parsed.x) } } },
    scales: {
      x: { grid: { display: false }, border: { color: cssVar('--axis') }, ticks: { color: muted, font: { size: 11 } } },
      y: { grid: { color: grid }, border: { display: false }, ticks: { color: muted, font: { size: 11 }, callback: v => rpShort(v), maxTicksLimit: 5 }, beginAtZero: true }
    }
  };
}
function mkChart(id, cfg) {
  if (typeof Chart === 'undefined') return;
  if (S.charts[id]) S.charts[id].destroy();
  const el = document.getElementById(id); if (!el) return;
  S.charts[id] = new Chart(el, cfg);
}
function drawCharts(cf, pengRows) {
  const labels = cf.map(c => lbShort(c.bulan));
  const bar = { borderRadius: 4, borderSkipped: 'start', maxBarThickness: 18, categoryPercentage: 0.7, barPercentage: 0.85 };
  mkChart('ch-cf', { type: 'bar', data: { labels, datasets: [
    Object.assign({ label: 'Masuk', data: cf.map(c => c.masuk), backgroundColor: cssVar('--series-1') }, bar),
    Object.assign({ label: 'Keluar', data: cf.map(c => c.keluar), backgroundColor: cssVar('--series-2') }, bar)
  ] }, options: baseOpts() });
  const o2 = baseOpts(); o2.scales.y.beginAtZero = false;
  mkChart('ch-saldo', { type: 'line', data: { labels, datasets: [{ label: 'Saldo', data: cf.map(c => c.saldo_akhir), borderColor: cssVar('--series-1'),
    backgroundColor: cssVar('--series-1'), borderWidth: 2, pointRadius: 4, pointHoverRadius: 6, pointBorderColor: cssVar('--surface'), pointBorderWidth: 2, spanGaps: true }] }, options: o2 });
  const o3 = baseOpts(); o3.indexAxis = 'y'; o3.interaction = { mode: 'nearest', axis: 'y', intersect: false };
  o3.scales = { x: { grid: { color: cssVar('--grid') }, border: { display: false }, ticks: { color: cssVar('--muted'), callback: v => rpShort(v), maxTicksLimit: 4 }, beginAtZero: true },
    y: { grid: { display: false }, border: { color: cssVar('--axis') }, ticks: { color: cssVar('--ink-2'), font: { size: 12 } } } };
  mkChart('ch-peng', { type: 'bar', data: { labels: pengRows.map(r => r[0]), datasets: [{ data: pengRows.map(r => r[1]), backgroundColor: cssVar('--series-1'),
    borderRadius: 4, borderSkipped: 'start', maxBarThickness: 18 }] }, options: o3 });
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => S.pub && renderRingkasan());

// ---------- iuran ----------
function cellState(kav, ym) {
  const p = S.pub, cell = (p.matriks[kav] || {})[ym];
  if (cell) return cell.status;
  if (ym < p.mulai) return null;
  return ym <= p.bulanIni ? 'tunggak' : 'belum';
}
function renderIuran() {
  const p = S.pub;
  const months = []; for (let i = 1; i <= 12; i++) months.push(S.year + '-' + String(i).padStart(2, '0'));
  const shown = months.filter(ym => ym >= p.mulai);
  const kavs = p.perKavling.filter(k => k.aktif);
  const khusus = p.khusus || [];
  $('#tab-iuran').innerHTML = `
    <div class="card">
      <h2>Status iuran ${S.year}</h2>
      <p class="desc">Hijau = uang sudah terlihat di rekening kas. Geser ke samping untuk bulan lain.</p>
      <div class="scroll-x"><table class="mx"><tr><th></th>${shown.map(ym => `<th>${BULAN[+ym.slice(5) - 1]}</th>`).join('')}</tr>
      ${kavs.map(k => `<tr><td class="kav">${esc(k.kavling)}<span>${esc(k.nama)}</span></td>${shown.map(ym => {
        const st = cellState(k.kavling, ym); if (!st) return '<td></td>';
        const c = CELL[st]; return `<td class="${c.cls}" title="${esc(k.kavling + ' · ' + lb(ym) + ' · ' + c.label)}" aria-label="${esc(lb(ym) + ': ' + c.label)}">${c.sym}</td>`;
      }).join('')}</tr>`).join('')}</table></div>
      <div class="mx-legend">${['lunas', 'prepaid', 'klaim', 'tunggak', 'belum'].map(s => `<span><b class="${CELL[s].cls}">${CELL[s].sym}</b>${CELL[s].label}</span>`).join('')}</div>
    </div>

    <div class="card">
      <h2>Per kavling</h2>
      <ul class="list">${kavs.map(k => `<li class="spread"><div><b>${esc(k.kavling)}</b> · ${esc(k.nama)}
        <div class="small muted">Tarif ${rp(k.tarifSekarang)}/bln · lunas berurutan s/d ${k.lunasSampai ? lb(k.lunasSampai) : '-'}${k.kredit ? ' · kredit ' + rp(k.kredit) : ''}</div>
        ${k.tunggakan.length ? `<div class="small muted">Belum: ${k.tunggakan.map(t => lbShort(t.bulan)).join(', ')}</div>` : ''}</div>
        ${k.tunggakan.length ? `<span class="status bad">✗ ${rp(k.totalTunggakan)}</span>` : '<span class="status good">✓ Lunas</span>'}</li>`).join('')}</ul>
    </div>

    ${khusus.map(kh => {
      const paid = kh.bayar || {}; const total = Object.values(paid).reduce((a, b) => a + b, 0);
      return `<div class="card"><h2>${esc(kh.nama)}</h2><p class="desc">${rp(kh.nominal)} per rumah · ${tgl(kh.mulai)}${kh.deadline ? ' s/d ' + tgl(kh.deadline) : ''} · terkumpul ${rp(total)} dari ${Object.keys(paid).length} rumah</p>
        <div class="chips">${kavs.map(k => `<span class="chip" style="cursor:default">${paid[k.kavling] ? '✓' : '✗'} ${esc(k.kavling)}</span>`).join('')}</div></div>`;
    }).join('')}`;
}

// ---------- transaksi ----------
function renderTransaksi() {
  if (!S.pub) return;
  const p = S.pub, f = S.trxFilter;
  const list = p.mutasi.filter(m => f === 'semua' || (f === 'masuk' && m.jenis === 'CR') || (f === 'keluar' && m.jenis === 'DB') || (f === 'cek' && (m.kelas === 'review' || m.flag)));
  const filters = { semua: 'Semua', masuk: 'Masuk', keluar: 'Keluar', cek: 'Perlu dicek' };
  $('#tab-transaksi').innerHTML = `
    ${p.klaimMenunggu.length ? `<div class="card"><h2>Klaim menunggu statement bank</h2><p class="desc">Akan otomatis dicocokkan saat mutasi bulan ini diupload.</p>
      <ul class="list">${p.klaimMenunggu.map(k => `<li class="spread"><div>${k.jalur === 'bendahara' ? '<b>Bendahara</b> · ' + esc(k.kategori || k.tipe) : '<b>' + esc(k.kavling) + '</b> · ' + esc(rangeBulan(k.bulan) || k.tipe)}
        <div class="small muted">${tgl(k.tanggal)}${k.adaBukti ? ' · ada bukti' : ''}</div></div><span class="amt">${rp(k.nominal)}</span></li>`).join('')}</ul></div>` : ''}
    <div class="chips">${Object.keys(filters).map(k => `<button class="chip ${k === f ? 'on' : ''}" data-f="${k}">${filters[k]}</button>`).join('')}</div>
    <div class="card"><ul class="list">${list.map(m => `<li data-mid="${esc(m.id)}" ${S.admin ? 'style="cursor:pointer"' : ''}>
      <div class="spread"><b>${esc(m.pihak || m.kategori || '-')}</b><span class="amt ${m.jenis === 'CR' ? 'in' : ''}">${m.jenis === 'CR' ? '+' : '−'}${rp(m.nominal).replace('Rp ', 'Rp ')}</span></div>
      <div class="small"><span class="badge ${m.kelas === 'review' || m.flag ? 'flag' : ''}">${esc(KELAS[m.kelas] || m.kelas)}</span>${m.kavling ? esc(m.kavling) + ' · ' : ''}${esc(m.kelas === 'iuran' ? rangeBulan(m.bulan) : (m.kategori !== KELAS[m.kelas] ? m.kategori : ''))}</div>
      <div class="small muted">${tgl(m.tanggal)}${m.berita ? ' · “' + esc(m.berita) + '”' : ''}${m.cara === 'tag' ? ' · diklasifikasi manual' : ''}</div></li>`).join('') || '<li class="empty">Tidak ada transaksi.</li>'}</ul>
      ${S.admin ? '<p class="small muted">Mode bendahara: ketuk transaksi untuk mengubah klasifikasinya.</p>' : ''}</div>`;
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.trxFilter = b.dataset.f; renderTransaksi(); });
  if (S.admin) document.querySelectorAll('[data-mid]').forEach(li => li.onclick = () => openTagEditor(li.dataset.mid));
}

// ---------- bayar (warga) ----------
async function renderBayar() {
  const el = $('#bayar-form');
  if (!S.formInfo) {
    el.innerHTML = '<div class="loading">Memuat form…</div>';
    try { S.formInfo = JSON.parse(await run('apiFormInfo')); } catch (e) { el.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; return; }
  }
  if (!S.form) S.form = { kavling: store.get('kas_kav') || '', tipe: 'iuran', bulan: [], khusus_id: '', nominal: '', manual: false, tanggal: todayIso(), catatan: '', file: null };

}
function drawBayar() {
  const info = S.formInfo, f = S.form, el = $('#bayar-form');
  const r = info.rumah.find(x => x.kavling === f.kavling);
  const lo = addM(info.bulanIni, -11), hi = addM(info.bulanIni, 6);
  const bulan = r ? r.bulan.filter(b => b.ym >= lo && b.ym <= hi) : [];
  if (!f.manual) {
    f.nominal = f.tipe === 'khusus' ? ((info.khusus.find(k => k.id === f.khusus_id) || {}).nominal || '')
      : f.bulan.reduce((a, ym) => a + ((bulan.find(b => b.ym === ym) || {}).tarif || 0), 0) || '';
  }
  el.innerHTML = `
  <div class="card">
    <h2>Konfirmasi pembayaran</h2>
    <p class="desc">Setelah transfer, isi form ini. Status jadi ✓ setelah bendahara upload mutasi bank. Kalau lupa isi form pun tetap tercatat dari mutasi, tapi form ini membantu mencocokkan.</p>
    <label class="f" for="f-kav">Kavling</label>
    <select id="f-kav"><option value="">— pilih —</option>${info.rumah.map(x => `<option value="${esc(x.kavling)}" ${x.kavling === f.kavling ? 'selected' : ''}>${esc(x.kavling + ' – ' + x.nama)}</option>`).join('')}</select>
    ${info.khusus.length ? `<label class="f">Jenis</label><div class="seg"><button data-tipe="iuran" class="${f.tipe === 'iuran' ? 'on' : ''}">Iuran bulanan</button><button data-tipe="khusus" class="${f.tipe === 'khusus' ? 'on' : ''}">Iuran khusus</button></div>` : ''}
    ${f.tipe === 'iuran' ? (r ? `<label class="f">Bulan yang dibayar (boleh lebih dari satu)</label><div class="months">${bulan.map(b => {
        const paid = b.status === 'lunas' || b.status === 'prepaid';
        const on = f.bulan.includes(b.ym);
        return `<label class="${on ? 'on' : ''} ${paid ? 'paid' : ''}"><input type="checkbox" value="${b.ym}" ${on ? 'checked' : ''}>${lbShort(b.ym)}<small>${paid ? 'lunas' : b.status === 'klaim' ? 'diklaim' : rp(b.tarif).replace('Rp ', '')}</small></label>`;
      }).join('')}</div>` : '<p class="small muted" style="margin-top:10px">Pilih kavling dulu.</p>')
      : `<label class="f" for="f-kh">Iuran khusus</label><select id="f-kh"><option value="">— pilih —</option>${info.khusus.map(k => `<option value="${esc(k.id)}" ${k.id === f.khusus_id ? 'selected' : ''}>${esc(k.nama)} (${rp(k.nominal)})</option>`).join('')}</select>`}
    <label class="f" for="f-nom">Nominal yang ditransfer (Rp)</label>
    <input id="f-nom" type="number" inputmode="numeric" min="1" value="${esc(f.nominal)}">
    <label class="f" for="f-tgl">Tanggal transfer</label>
    <input id="f-tgl" type="date" value="${esc(f.tanggal)}" max="${todayIso()}">
    <label class="f" for="f-file">Bukti transfer (opsional)</label>
    <input id="f-file" type="file" accept="image/*,application/pdf">
    <label class="f" for="f-cat">Catatan (opsional)</label>
    <input id="f-cat" type="text" maxlength="300" value="${esc(f.catatan)}" placeholder="mis. ditransfer dari rekening suami">
    <div id="f-err" class="err" style="margin-top:8px"></div>
    <button class="btn block" id="f-kirim" style="margin-top:14px">Kirim konfirmasi</button>
  </div>`;
  $('#f-kav').onchange = e => { f.kavling = e.target.value; f.bulan = []; f.manual = false; store.set('kas_kav', f.kavling); drawBayar(); };
  document.querySelectorAll('[data-tipe]').forEach(b => b.onclick = () => { f.tipe = b.dataset.tipe; f.manual = false; drawBayar(); });
  if ($('#f-kh')) $('#f-kh').onchange = e => { f.khusus_id = e.target.value; f.manual = false; drawBayar(); };
  document.querySelectorAll('.months input').forEach(c => c.onchange = () => {
    f.bulan = c.checked ? [...f.bulan, c.value].sort() : f.bulan.filter(x => x !== c.value); f.manual = false; drawBayar();
  });
  $('#f-nom').oninput = e => { f.nominal = e.target.value; f.manual = true; };
  $('#f-tgl').onchange = e => f.tanggal = e.target.value;
  $('#f-cat').oninput = e => f.catatan = e.target.value;
  $('#f-file').onchange = e => f.file = e.target.files[0] || null;
  $('#f-kirim').onclick = kirimKlaim;
}
async function kirimKlaim() {
  const f = S.form, btn = $('#f-kirim'), err = $('#f-err');
  err.textContent = '';
  if (!f.kavling) return err.textContent = 'Pilih kavling.';
  if (f.tipe === 'iuran' && !f.bulan.length) return err.textContent = 'Centang bulan yang dibayar.';
  if (f.tipe === 'khusus' && !f.khusus_id) return err.textContent = 'Pilih iuran khusus.';
  if (!(+f.nominal > 0)) return err.textContent = 'Isi nominal.';
  btn.disabled = true; btn.textContent = 'Mengirim…';
  try {
    const bukti = f.file ? await fileToBase64(f.file) : null;
    await run('apiSubmitKlaim', { kavling: f.kavling, tipe: f.tipe, bulan: f.bulan, khusus_id: f.khusus_id, nominal: +f.nominal, tanggal: f.tanggal, catatan: f.catatan, bukti });
    $('#bayar-form').innerHTML = `<div class="card"><h2>Terima kasih! 🙏</h2><p>Konfirmasi ${esc(f.kavling)} sebesar <b>${rp(f.nominal)}</b>${f.bulan.length ? ' untuk ' + esc(f.bulan.map(lb).join(', ')) : ''} sudah tercatat.</p>
      <p class="small muted">Statusnya “menunggu” sampai bendahara mengupload mutasi bank bulan ini, lalu otomatis jadi ✓.</p>
      <button class="btn ghost" id="f-lagi">Isi lagi</button></div>`;
    S.form = null; S.formInfo = null;
    $('#f-lagi').onclick = renderBayar;
    loadPublic().catch(() => {});
  } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = 'Kirim konfirmasi'; }
}

function openTagEditor(mid) {
  const a = S.admin;
  const m = S.pub.mutasi.find(x => x.id === mid); if (!m) return;
  const rv = a.review.find(x => x.id === mid) || {};
  const tag = a.tags[mid] || {};
  const saran = rv.saran || {};
  const defTipe = tag.tipe || (m.kelas !== 'review' && m.kelas !== 'biaya_bank' && m.kelas !== 'bunga' ? m.kelas : (m.jenis === 'DB' ? 'pengeluaran' : (saran.khusus_id ? 'khusus' : 'iuran')));
  const st = { tipe: defTipe, kavling: tag.kavling || m.kavling || saran.kavling || '', bulan: (tag.bulan && tag.bulan.length ? tag.bulan : (m.kelas === 'iuran' ? m.bulan : saran.bulan || [])).slice(),
    kategori: tag.kategori || (m.kelas === 'pengeluaran' ? m.kategori : '') || 'Lain-lain', khusus_id: tag.khusus_id || saran.khusus_id || '', catatan: tag.catatan || '', simpan: m.jenis === 'CR' && !!m.pihak };
  const base = m.tanggal.slice(0, 7);
  const months = []; for (let i = -6; i <= 13; i++) months.push(addM(base, i));
  const tipeOpts = m.jenis === 'CR'
    ? { iuran: 'Iuran bulanan', khusus: 'Iuran khusus', tombokan: 'Tombokan bendahara (jadi utang kas)', pemasukan_lain: 'Pemasukan lain', abaikan: 'Abaikan' }
    : { pengeluaran: 'Pengeluaran', pelunasan: 'Pelunasan utang ke bendahara', abaikan: 'Abaikan' };
  function draw() {
    modal(`<h2>${m.jenis === 'CR' ? '+' : '−'}${rp(m.nominal)} · ${esc(m.pihak || m.kategori || '')}</h2>
      <p class="desc">${tgl(m.tanggal)}${m.berita ? ' · “' + esc(m.berita) + '”' : ''}</p>
      <label class="f">Jenis</label><select id="t-tipe">${Object.keys(tipeOpts).map(k => `<option value="${k}" ${k === st.tipe ? 'selected' : ''}>${tipeOpts[k]}</option>`).join('')}</select>
      ${st.tipe === 'iuran' || st.tipe === 'khusus' ? `<label class="f">Kavling</label><select id="t-kav"><option value="">—</option>${a.rumah.map(r => `<option value="${esc(r.kavling)}" ${r.kavling === st.kavling ? 'selected' : ''}>${esc(r.kavling + ' – ' + r.nama)}</option>`).join('')}</select>` : ''}
      ${st.tipe === 'iuran' ? `<label class="f">Bulan (kosongkan = otomatis ke bulan tertunggak paling lama)</label><div class="months">${months.map(ym => `<label class="${st.bulan.includes(ym) ? 'on' : ''}"><input type="checkbox" value="${ym}" ${st.bulan.includes(ym) ? 'checked' : ''}>${lbShort(ym)}</label>`).join('')}</div>` : ''}
      ${st.tipe === 'khusus' ? `<label class="f">Iuran khusus</label><select id="t-kh">${S.pub.khusus.map(k => `<option value="${esc(k.id)}" ${k.id === st.khusus_id ? 'selected' : ''}>${esc(k.nama)}</option>`).join('')}</select>` : ''}
      ${st.tipe === 'pengeluaran' ? `<label class="f">Kategori</label><select id="t-kat">${a.kategori.map(k => `<option ${k === st.kategori ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select>` : ''}
      <label class="f">Catatan</label><input id="t-cat" type="text" value="${esc(st.catatan)}">
      ${(st.tipe === 'iuran' || st.tipe === 'khusus') && m.jenis === 'CR' && m.pihak ? `<label class="row small" style="margin-top:10px"><input type="checkbox" id="t-simpan" ${st.simpan ? 'checked' : ''} style="width:auto;min-height:0"> Ingat “${esc(m.pihak)}” sebagai rekening kavling ini (transfer berikutnya otomatis)</label>` : ''}
      <div class="row" style="margin-top:14px"><button class="btn" id="t-ok">Simpan</button>${a.tags[mid] ? '<button class="btn danger" id="t-del">Hapus tag</button>' : ''}<button class="btn ghost" onclick="closeModal()">Batal</button></div>`);
    $('#t-tipe').onchange = e => { st.tipe = e.target.value; draw(); };
    if ($('#t-kav')) $('#t-kav').onchange = e => st.kavling = e.target.value;
    if ($('#t-kh')) { st.khusus_id = $('#t-kh').value; $('#t-kh').onchange = e => st.khusus_id = e.target.value; }
    if ($('#t-kat')) $('#t-kat').onchange = e => st.kategori = e.target.value;
    $('#t-cat').oninput = e => st.catatan = e.target.value;
    if ($('#t-simpan')) $('#t-simpan').onchange = e => st.simpan = e.target.checked;
    document.querySelectorAll('.modal .months input').forEach(c => c.onchange = () => {
      st.bulan = c.checked ? [...st.bulan, c.value].sort() : st.bulan.filter(x => x !== c.value); draw();
    });
    $('#t-ok').onclick = async () => {
      if (st.tipe === 'iuran' && !st.kavling) return toast('Pilih kavling.');
      const b = $('#t-ok'); b.disabled = true;
      try {
        await run('apiTag', S.token, { mutasi_id: mid, tipe: st.tipe, kavling: st.kavling, bulan: st.tipe === 'iuran' ? st.bulan : [],
          kategori: st.tipe === 'pengeluaran' ? st.kategori : '', khusus_id: st.tipe === 'khusus' ? st.khusus_id : '', catatan: st.catatan },
          { simpanRekening: !!(st.simpan && $('#t-simpan')), pihak: m.pihak });
        closeModal(); await refreshAll('Tersimpan');
      } catch (e) { fail(e); b.disabled = false; }
    };
    if ($('#t-del')) $('#t-del').onclick = async () => { try { await run('apiHapusTag', S.token, mid); closeModal(); await refreshAll('Tag dihapus'); } catch (e) { fail(e); } };
  }
  draw();
}

function showPreview(res) {
  const ok = res.preview.every(p => !p.errors.length);
  $('#imp-preview').innerHTML = `<div class="card"><h2>Cek sebelum simpan</h2>
    ${res.preview.map(p => `<div style="margin:8px 0 12px"><div class="spread"><b>${lb(p.periode)}</b><span class="small">${p.jumlah} transaksi</span></div>
      <div class="small tnum">Saldo ${rp(p.saldo_awal)} → ${rp(p.saldo_akhir)} · masuk ${rp(p.total_cr)} · keluar ${rp(p.total_db)}</div>
      ${p.errors.map(e => `<div class="err">✗ ${esc(e)}</div>`).join('')}${p.warnings.map(w => `<div class="small">⚠ ${esc(w)}</div>`).join('')}
      ${!p.errors.length ? '<div class="small" style="color:var(--good-ink)">✓ Saldo cocok dengan ringkasan BCA</div>' : ''}
      <details><summary class="small">Lihat transaksi</summary><div class="scroll-x"><table class="data">${(p.transaksi || []).map(t => `<tr><td>${t.tanggal.slice(8)}</td><td>${esc(t.pihak || t.keterangan)}<div class="small muted">${esc(t.berita)}</div></td><td class="n">${t.jenis === 'DB' ? '−' : '+'}${rp(t.nominal)}</td></tr>`).join('')}</table></div></details></div>`).join('')}
    ${res.extra && (res.extra.rumah || res.extra.tags) ? `<p class="small muted">Termasuk ${res.extra.rumah} data rumah & ${res.extra.tags} klasifikasi manual.</p>` : ''}
    <button class="btn block" id="imp-commit" ${ok ? '' : 'disabled'}>${ok ? 'Simpan ke kas' : 'Ada error — tidak bisa disimpan'}</button></div>`;
  $('#imp-commit').onclick = async () => {
    const b = $('#imp-commit'); b.disabled = true; b.textContent = 'Menyimpan…';
    try { const r = await run('apiCommitImport', S.token, res.key); $('#imp-preview').innerHTML = ''; await refreshAll(r.pesan); } catch (e) { fail(e); b.disabled = false; }
  };
  $('#imp-preview').scrollIntoView({ behavior: 'smooth' });
}

function loadChartJs() {
  const srcs = (window.__CHART_SRC ? [window.__CHART_SRC] : []).concat(['https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js',
    'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js']);
  (function next(i) {
    if (i >= srcs.length) return;
    const el = document.createElement('script');
    el.src = srcs[i]; el.async = true;
    el.onload = () => { if (S.pub) renderRingkasan(); };
    el.onerror = () => next(i + 1);
    document.head.appendChild(el);
  })(0);
}

// ---------- gerak halus: progres scroll, parallax foto, hitung naik, salin, link tab ----------
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
(function motion() {
  const bar = $('#progress');
  const ph = document.querySelector('.hero-img .ph');
  let ticking = false;
  function frame() {
    ticking = false;
    const max = document.documentElement.scrollHeight - window.innerHeight;
    if (bar) bar.style.transform = 'scaleX(' + (max > 0 ? Math.min(1, window.scrollY / max) : 0) + ')';
    if (ph && !reduceMotion) ph.style.transform = 'translate3d(0,' + Math.round(window.scrollY * 0.12) + 'px,0)';
  }
  window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(frame); } }, { passive: true });
  frame();
})();
function countUp(el) {
  const to = +el.dataset.to, fmt = el.dataset.fmt;
  const show = v => el.textContent = fmt === 'rp' ? rp(v) : String(Math.round(v));
  if (reduceMotion || !(to > 0)) return show(to);
  const t0 = performance.now(), dur = 1100;
  (function step(t) {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    show(to * e);
    if (k < 1) requestAnimationFrame(step); else show(to);
  })(t0);
}
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(entries => entries.forEach(en => {
    if (en.isIntersecting) { io.unobserve(en.target); countUp(en.target); }
  }), { threshold: 0.6 });
  document.querySelectorAll('.count').forEach(el => io.observe(el));
}
